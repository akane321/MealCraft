[project]
name = "mealcraft-backend"
version = "0.1.0"
description = "Backend API for MealCraft"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "pydantic-settings==2.15.0",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.4",
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
]

[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]
