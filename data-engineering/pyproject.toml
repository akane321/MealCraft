[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mealcraft-data-cleaning"
version = "0.1.0"
description = "Reproducible recipe and ingredient data-cleaning demonstration for MealCraft"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mealcraft-data = "mealcraft_data.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

