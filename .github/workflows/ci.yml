name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs-and-data
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Documentation integrity
        run: python scripts/check_docs_integrity.py

      - name: Held-out episode integrity
        run: python scripts/check_heldout_episodes.py

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --project backend --frozen --dev

      - name: Ruff lint
        run: uv run --project backend ruff check backend

      - name: Ruff format
        run: uv run --project backend ruff format --check backend

      - name: Backend tests
        run: uv run --project backend pytest backend/tests

      - name: MVP data and planning evaluation
        run: uv run --project backend python -m app.evaluation

      - name: Offline evaluation workbench
        run: uv run --project backend python -m app.evaluation.workbench

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.17.1"
          package_json_file: frontend/package.json

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: frontend
        run: pnpm lint

      - name: Frontend tests
        working-directory: frontend
        run: pnpm test

      - name: TypeScript
        working-directory: frontend
        run: pnpm typecheck

      - name: Production build
        working-directory: frontend
        run: pnpm build

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser acceptance tests
        working-directory: frontend
        run: pnpm test:e2e

  # Named `compose` because that is the required status check on `main`. The job
  # is no longer only a Compose config check - see the comment below - but the
  # check name is part of the branch ruleset, and renaming it silently makes
  # every pull request unmergeable while still reporting green.
  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The `backend` job runs the suite from a checkout: `<repo>/backend/tests`.
    # CONTRIBUTING.md and AGENTS.md tell contributors to verify through the
    # container instead, where the same files live at `/app/tests` and the
    # catalogs are bind-mounted at `/app/data`. Those are different directory
    # depths, so code that located data by counting parent directories worked in
    # one and not the other. CI covered only the first, so the suite stayed green
    # while the documented command reported 82 failures on a missing file.
    #
    # This job runs the documented commands themselves. A green CI should mean
    # the instructions we give people actually work.
    #
    # Scope: backend only. The documented frontend commands
    # (`docker compose run --rm frontend pnpm ...`) are still exercised on the
    # host by the `frontend` job and not through the container, because building
    # that image on every pull request costs more than the risk it retires. That
    # gap is deliberate and stated rather than assumed away.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and start the database and backend
        run: docker compose up -d --build --wait database backend

      - name: Backend tests through the documented command
        run: docker compose exec -T backend uv run --no-sync pytest

      - name: Deterministic data and planning evaluation
        run: docker compose exec -T backend uv run --no-sync python -m app.evaluation

      - name: Offline evaluation workbench
        run: docker compose exec -T backend uv run --no-sync python -m app.evaluation.workbench

      - name: Generated evaluation reports are reproducible
        # The workbench writes into the bind-mounted `docs/evaluation`. Regenerating
        # it must not change the committed report, or the numbers we publish are
        # not the numbers the command produces.
        run: git diff --exit-code -- docs/evaluation

      - name: Backend logs
        if: failure()
        run: docker compose logs --no-color backend

      - name: Tear down
        if: always()
        run: docker compose down -v
