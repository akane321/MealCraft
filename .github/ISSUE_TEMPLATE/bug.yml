name: Bug report
description: 报告一个可以复现的问题
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        请提供足够信息，让其他成员能够独立复现问题。不要粘贴密码、Token 或个人数据。
  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请按顺序列出操作、输入和使用的页面或 API。
      placeholder: |
        1. 启动 ...
        2. 打开 ...
        3. 输入 ...
        4. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - Frontend
        - Backend / API
        - Planning engine
        - Recipe / data
        - FairPrice integration
        - Database / migration
        - Docker / development environment
        - Documentation
        - Unsure
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: 分支或提交
      description: 例如 main、feat/weekly-meal-plan 或 commit SHA。
  - type: textarea
    id: evidence
    attributes:
      label: 日志、截图或其他证据
      description: 可拖入截图；日志请删除敏感信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，没有发现相同问题
          required: true
        - label: 我没有在本 Issue 中公开密码、Token 或个人数据
          required: true
